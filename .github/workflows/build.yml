name: Build

on:
  push:
    branches: main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.json'
  pull_request:
    branches: '*'
    paths:
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JupyterLab
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Install and build packages
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_CHECKSUM_BEHAVIOR: update
        run: |
          set -eux
          jlpm install
          jlpm build

      # The release workflow publishes from build:prod, which enables webpack
      # plugins the dev build skips. `python -m build` below cannot cover this:
      # skip-if-exists in pyproject.toml sees the dev output and skips the
      # production build entirely. Run it explicitly so a prod-only failure
      # fails CI instead of silently breaking the next release.
      - name: Production build (matches the release path)
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_CHECKSUM_BEHAVIOR: update
        run: |
          set -eux
          npm run build -w packages/core
          npm run build:prod -w packages/extension

      - name: Test extension loads
        working-directory: packages/extension
        run: |
          set -eux
          python -m pip install .[test]
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "a11y-checker.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        working-directory: packages/extension
        run: |
          set -eux
          pip install build
          python -m build
          pip uninstall -y "jupyterlab_a11y_checker" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: packages/extension/dist/jupyterlab_a11y_checker*
          if-no-files-found: error
